name: ctf7-prioritize-final

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ctf7-prioritize-final.yml'
      - 'ctf7/prioritize-final-trigger-*'

permissions:
  actions: write
  contents: read

jobs:
  prioritize:
    runs-on: ubuntu-22.04
    steps:
      - name: Preserve only the strongest SAT, lattice, and monitor runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          sleep 45
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status=="queued" or .status=="in_progress") | [.id,.name,.status] | @tsv' \
            > /tmp/runs.tsv
          cat /tmp/runs.tsv
          while IFS=$'\t' read -r id name status; do
            case "$name" in
              ctf7-sat-dir-hints|ctf7-hm-flatter|ctf7-cubes-monitor|ctf7-universal-monitor|ctf7-prioritize-final)
                echo "keeping $id $name $status" ;;
              ctf7-*)
                echo "cancelling $id $name $status"
                gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true ;;
            esac
          done < /tmp/runs.tsv
