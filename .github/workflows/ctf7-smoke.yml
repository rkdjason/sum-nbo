name: ctf7-smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'ctf7/**'
      - '.github/workflows/ctf7-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install SageMath and flatter build dependencies
        run: |
          sudo apt-get update -qq >/tmp/apt.log 2>&1
          sudo apt-get install -qq -y --no-install-recommends \
            sagemath git cmake g++ make libgmp-dev libmpfr-dev \
            libfplll-dev libeigen3-dev libopenblas-dev >>/tmp/apt.log 2>&1
      - name: Build and install flatter
        run: |
          git clone -q --depth=1 https://github.com/keeganryan/flatter /tmp/flatter
          cmake -S /tmp/flatter -B /tmp/flatter/build -DCMAKE_BUILD_TYPE=Release >/tmp/flatter-build.log 2>&1
          cmake --build /tmp/flatter/build -j2 >>/tmp/flatter-build.log 2>&1
          sudo cmake --install /tmp/flatter/build >>/tmp/flatter-build.log 2>&1
          sudo ldconfig
          command -v sage
          command -v flatter
      - name: Full-size single-candidate benchmark
        run: |
          set -o pipefail
          /usr/bin/time -v sage -python ctf7/solve.py --d 0 --a-start 0 --a-end 1 --m 24 --t 7 --delta 0.99 --work /tmp/ctf7-smoke 2>&1 | tee /tmp/ctf7-smoke.log || true
          echo '=== solver summary ==='
          grep -E 'CONFIG|MASK_|BOUNDS_|CANDIDATE|REDUCED|POLYS|ROOT|FOUND_|ERROR|NOT_FOUND|Elapsed|Maximum resident' /tmp/ctf7-smoke.log || true
      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctf7-smoke-log
          path: /tmp/ctf7-smoke.log
          if-no-files-found: warn
