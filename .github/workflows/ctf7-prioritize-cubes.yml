name: ctf7-prioritize-cubes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ctf7-prioritize-cubes.yml'
      - 'ctf7/prioritize-cubes-trigger-*'

permissions:
  actions: write
  contents: read

jobs:
  prioritize:
    runs-on: ubuntu-22.04
    steps:
      - name: Keep cube solver and monitors; cancel lower-priority portfolios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          sleep 30
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status=="queued" or .status=="in_progress") | [.id,.name,.status] | @tsv' \
            > /tmp/runs.tsv
          cat /tmp/runs.tsv
          while IFS=$'\t' read -r id name status; do
            case "$name" in
              ctf7-sat2|ctf7-sat2-cms|ctf7-bv|ctf7-cpsat|ctf7-sat-dir|ctf7-fastbench|ctf7-lattice-bench)
                echo "cancelling $id $name $status"
                gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" || true
                ;;
            esac
          done < /tmp/runs.tsv
