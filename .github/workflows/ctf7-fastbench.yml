name: ctf7-fastbench

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ctf7-fastbench.yml'

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install SageMath and build flatter
        run: |
          sudo apt-get update -qq >/tmp/install.log 2>&1
          sudo apt-get install -qq -y --no-install-recommends sagemath git cmake g++ make libgmp-dev libmpfr-dev libfplll-dev libeigen3-dev libopenblas-dev >>/tmp/install.log 2>&1
          git clone -q --depth=1 https://github.com/keeganryan/flatter /tmp/flatter
          cmake -S /tmp/flatter -B /tmp/flatter/build -DCMAKE_BUILD_TYPE=Release >/tmp/build.log 2>&1
          cmake --build /tmp/flatter/build -j2 >>/tmp/build.log 2>&1
          sudo cmake --install /tmp/flatter/build >>/tmp/build.log 2>&1
          sudo ldconfig
      - name: Benchmark standard LLL quality
        run: |
          set +e
          mkdir -p /tmp/ctf7-fast
          timeout 3600s /usr/bin/time -v sage -python ctf7/solve.py --d 0 --a-start 0 --a-end 1 --m 24 --t 7 --delta 0.80 --work /tmp/ctf7-fast 2>&1 | tee /tmp/ctf7-fast.log
          echo "STATUS=${PIPESTATUS[0]}" | tee -a /tmp/ctf7-fast.log
          grep -E 'CONFIG|CANDIDATE|REDUCED|POLYS|ROOT|FOUND_|ERROR|NOT_FOUND|Elapsed|Maximum resident|STATUS' /tmp/ctf7-fast.log || true
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctf7-fastbench-log
          path: /tmp/ctf7-fast.log
          retention-days: 2
